appId: com.pflegeshift.app.internal
---
- runFlow: onboarding.yml
- tapOn:
    text: ".*0 Einträge.*"
    index: 10
- tapOn: "Schicht hinzufügen"
- assertVisible: "Meine Dienste"
- tapOn: "Früh direkt eintragen"
- extendedWaitUntil:
    visible: "Früh"
    timeout: 10000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Früh"
    timeout: 15000
